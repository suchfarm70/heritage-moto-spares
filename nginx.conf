# ==============================================================================
# Heritage Moto Spares — Nginx Production Configuration Block
# CSET489 Technical SEO (Slide 20: Force HTTPS and One Hostname)
# ==============================================================================

# Redirect HTTP & www variants to single canonical HTTPS non-www in ONE 301 hop
server {
    listen 80;
    listen [::]:80;
    server_name heritagemotospares.com www.heritagemotospares.com;
    return 301 https://heritagemotospares.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.heritagemotospares.com;

    ssl_certificate /etc/letsencrypt/live/heritagemotospares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heritagemotospares.com/privkey.pem;

    return 301 https://heritagemotospares.com$request_uri;
}

# Canonical Primary Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heritagemotospares.com;

    root /var/www/heritagemotospares/site;
    index index.html;

    # SSL Configuration (Let's Encrypt / Cloudflare Full Strict Mode)
    ssl_certificate /etc/letsencrypt/live/heritagemotospares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heritagemotospares.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS & Security Headers (Slide 27)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GZIP Compression (Slide 30)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Cache-Control Headers for Static Assets (Slide 22, 29)
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, max-age=31536000";
    }

    # Clean URL handling
    location / {
        try_files $uri $uri/ =404;
    }
}
